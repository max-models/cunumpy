name: Docs

# The Astro + Starlight site in docs/: hand-written pages and the API reference. Built on every
# push and pull request with the shared workflow of max-models/starlight-theme; deployed to GitHub
# Pages from devel (the Sphinx site was deployed from devel too).

on:
  push:
    branches: ["main", "devel"]
  pull_request:
    branches: ["main", "devel"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    uses: max-models/starlight-theme/.github/workflows/docs.yml@v0.5.0
    with:
      notebooks: false
      # stable-branch: main  # deploy the latest release at /<repo>/ and devel at /<repo>/dev/
      smoke-paths: |
        index.html
        getting-started/installation/index.html
        getting-started/quickstart/index.html
        guides/backends/index.html
        guides/particle-codes/index.html
        kernels/overview/index.html
        kernels/cuda-kernel/index.html
        examples/index.html
        ai-assistants/index.html
        reference/index.html
        api/cunumpy/index.html
        api/cunumpy/kernels/index.html
        api/cunumpy/cuda/index.html
        api/cunumpy/objects.inv
        installation.html/index.html
