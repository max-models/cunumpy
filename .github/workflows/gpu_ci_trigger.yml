name: Trigger GitLab GPU CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch: # Allows manual triggering

jobs:
  trigger-gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitLab Pipeline
        run: |
          # Use curl to call the GitLab Trigger API
          # We pass the GitHub SHA and Repository to GitLab so it knows exactly what to clone.
          curl --request POST \
            --form token=${{ secrets.GITLAB_TRIGGER_TOKEN }} \
            --form ref=main \
            --form "variables[GH_SHA]=${{ github.event.pull_request.head.sha || github.sha }}" \
            --form "variables[GH_REPO]=${{ github.repository }}" \
            "https://gitlab.mpcdf.mpg.de/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline"
