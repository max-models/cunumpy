# SETUP INSTRUCTIONS:
# ------------------
# This workflow synchronizes the code to GitLab via SSH to trigger GPU-enabled CI.
# 
# 1. GENERATE SSH KEY PAIR (on your local machine):
#    ssh-keygen -t ed25519 -f ~/.ssh/gitlab_sync_key -N "" -C "github-to-gitlab-sync"
#
# 2. CONFIGURE GITLAB (The Target):
#    - Go to GitLab project > Settings > Repository > Deploy keys.
#    - Add the content of '~/.ssh/gitlab_sync_key.pub'.
#    - IMPORTANT: Check "Allow write access to this repository".
#
# 3. CONFIGURE GITHUB (The Source):
#    - Go to GitHub repo > Settings > Secrets and variables > Actions.
#    - Add new Repository Secrets:
#      - Name: GITLAB_SSH_PRIVATE_KEY
#        Value: Paste the entire content of '~/.ssh/gitlab_sync_key'.
#      - Name: GITLAB_TOKEN
#        Value: Your GitLab Personal Access Token (with 'api' and 'read_repository' scopes).
#

name: Sync to GitLab and Run GPU CI

on:
  push:
    branches: [devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:
  workflow_call:

jobs:
  sync-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}

      - name: Push to GitLab via SSH & Provide Link
        id: push
        run: |
          # 1. Setup SSH known hosts
          mkdir -p ~/.ssh
          ssh-keyscan gitlab.mpcdf.mpg.de >> ~/.ssh/known_hosts

          # 2. Determine target branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TARGET_BRANCH="gpu-test-pr-${{ github.event.number }}"
          else
            SOURCE_REF="${{ github.ref_name }}"
            SAFE_REF="${SOURCE_REF//\//-}"
            TARGET_BRANCH="gpu-test-${SAFE_REF}"
          fi
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> "$GITHUB_ENV"

          # 3. Add GitLab SSH remote
          git remote add gitlab git@gitlab.mpcdf.mpg.de:maxlin/cunumpy.git

          # 4. Force push (This automatically starts the GitLab Pipeline)
          git push -f gitlab "HEAD:refs/heads/$TARGET_BRANCH"
          echo "PUSHED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          # 5. Provide the direct link
          PIPELINE_URL="https://gitlab.mpcdf.mpg.de/maxlin/cunumpy/-/pipelines?ref=$TARGET_BRANCH"

          echo "::notice::GitLab GPU CI Pipeline started automatically via Push!"
          echo "::notice::View Pipeline: $PIPELINE_URL"

      - name: Wait for GitLab Pipeline
        timeout-minutes: 90
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          API="https://gitlab.mpcdf.mpg.de/api/v4/projects/maxlin%2Fcunumpy"
          AUTH=()
          if [ -n "$GITLAB_TOKEN" ]; then AUTH=(--header "PRIVATE-TOKEN: $GITLAB_TOKEN"); fi

          # 1. GitLab creates the pipeline asynchronously after the push: wait until
          #    the pipeline for the pushed commit exists (asking right away finds none).
          PIPELINE=""
          for _ in $(seq 1 60); do
            PIPELINE=$(curl -sf "${AUTH[@]}" "$API/pipelines?ref=$TARGET_BRANCH&sha=$PUSHED_SHA&per_page=1" | jq -r '.[0].id // empty' || true)
            if [ -n "$PIPELINE" ]; then break; fi
            sleep 5
          done
          if [ -z "$PIPELINE" ]; then
            echo "::error::No GitLab pipeline for $PUSHED_SHA on $TARGET_BRANCH after 5 minutes"
            exit 1
          fi
          URL="https://gitlab.mpcdf.mpg.de/maxlin/cunumpy/-/pipelines/$PIPELINE"
          echo "::notice::GitLab pipeline: $URL"

          # 2. Follow the pipeline until it has finished.
          while true; do
            STATUS=$(curl -sf "${AUTH[@]}" "$API/pipelines/$PIPELINE" | jq -r '.status // empty' || true)
            case "$STATUS" in
              success)
                echo "GitLab pipeline $PIPELINE succeeded: $URL"
                exit 0 ;;
              failed|canceled|skipped|manual|scheduled)
                echo "::error::GitLab pipeline $PIPELINE is $STATUS: $URL"
                exit 1 ;;
              *)
                echo "GitLab pipeline $PIPELINE: ${STATUS:-status not available yet}"
                sleep 20 ;;
            esac
          done
