name: Sync to GitLab and Run GPU CI

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

jobs:
  sync-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITLAB_SSH_PRIVATE_KEY }}

      - name: Push to GitLab via SSH
        run: |
          # 1. Setup SSH known hosts to prevent interactive prompts
          mkdir -p ~/.ssh
          ssh-keyscan gitlab.mpcdf.mpg.de >> ~/.ssh/known_hosts

          # 2. Determine target branch
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TARGET_BRANCH="pr-${{ github.event.number }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          echo "Pushing to GitLab branch: $TARGET_BRANCH"

          # 3. Add GitLab SSH remote
          git remote add gitlab git@gitlab.mpcdf.mpg.de:maxlin/cunumpy.git

          # 4. Force push
          git push -f gitlab HEAD:refs/heads/$TARGET_BRANCH
          
          # Store branch for next step
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV

      - name: Trigger GitLab Pipeline & Provide Link
        run: |
          # Trigger the pipeline and capture the JSON response
          RESPONSE=$(curl --silent --request POST \
            --form token=${{ secrets.GITLAB_TRIGGER_TOKEN }} \
            --form "ref=$TARGET_BRANCH" \
            "https://gitlab.mpcdf.mpg.de/api/v4/projects/${{ secrets.GITLAB_PROJECT_ID }}/trigger/pipeline")
          
          # Extract the pipeline web_url using python (built-in to runner)
          PIPELINE_URL=$(echo $RESPONSE | python3 -c "import sys, json; print(json.load(sys.stdin).get('web_url', ''))")
          
          if [ -z "$PIPELINE_URL" ]; then
            echo "::error::Failed to trigger GitLab pipeline. Response: $RESPONSE"
            exit 1
          fi
          
          echo "::notice::GitLab GPU CI Pipeline triggered successfully!"
          echo "::notice::View Pipeline: $PIPELINE_URL"
          echo "PIPELINE_URL=$PIPELINE_URL" >> $GITHUB_ENV
