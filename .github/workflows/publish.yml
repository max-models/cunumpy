name: Publish Python Package

on:
  push:
    branches:
      - main

jobs:
  # The local reusable workflow checks out this push's commit, so publishing cannot race the
  # CPU tests. The GPU tests run on devel and on pull requests (gpu_ci_trigger.yml), not here:
  # they are slow and need the GitLab runner, which a release should not wait for.
  cpu-tests:
    uses: ./.github/workflows/testing.yml

  build-and-publish:
    needs: [cpu-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build the package
        run: python -m build

      - name: Check distributions and smoke-test the installed wheel
        run: |
          python -m twine check dist/*
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I testing/smoke_wheel.py

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__  # Use API token
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

