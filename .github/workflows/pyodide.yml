name: Pyodide

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main, devel]

jobs:
  wheel-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/pyodide/package-lock.json
      - name: Build wheel and install compiler-free test dependencies
        run: |
          python -m pip install build '.[test]'
          python -m build --wheel
      - name: Run portable tests in native Python
        run: python -m pytest -q tests/portable
      - name: Install Pyodide
        run: npm ci --prefix tests/pyodide
      - name: Run portable tests against the wheel in Pyodide
        run: node tests/pyodide/run.mjs dist/cunumpy-*-py3-none-any.whl
