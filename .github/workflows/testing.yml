name: Tests

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - main
      - devel
  workflow_call:

jobs:
  compiled-fake-cupy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compilers and compiled-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gfortran
          python -m pip install ".[test-compiled]"
      - name: Test compiled host kernels with fake device arrays
        env:
          CUNUMPY_FAKE_CUPY: "1"
          CUNUMPY_BACKEND: cupy
          CUNUMPY_REQUIRE_PYCCEL: "1"
        run: python -m pytest -q tests/unit/test_pyccel_kernel.py tests/unit/test_cupy.py

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Cache pip dependencies
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: |
          pytest .

      - name: Run docstring examples
        run: |
          pytest --doctest-modules src/cunumpy

      - name: Test docs build
        run: |
          pip install ".[docs]"
          cd docs
          make clean
          make html SPHINXOPTS="-W --keep-going"
          cd ..
          ls docs/build/html/index.html
