name: Tests

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - main
      - devel
  workflow_call:

# Runs that do not target main install the devel branches of the max-models dependencies
# (requirements-devel.txt) before cunumpy; PRs to main and the release use PyPI only.
jobs:
  compiled-fake-cupy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compilers and compiled-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gfortran
          if [ "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" != main ]; then python -m pip install -r requirements-devel.txt; fi
          python -m pip install ".[test-compiled]"
      - name: Test compiled host kernels with fake device arrays
        env:
          CUNUMPY_FAKE_CUPY: "1"
          CUNUMPY_BACKEND: cupy
          CUNUMPY_REQUIRE_PYCCEL: "1"
        run: python -m pytest -q tests/unit/test_pyccel_kernel.py tests/unit/test_cupy.py

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Cache pip dependencies
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install project
        run: |
          pip install --upgrade pip
          if [ "${GITHUB_BASE_REF:-$GITHUB_REF_NAME}" != main ]; then python -m pip install -r requirements-devel.txt; fi
          pip install ".[dev]"

      - name: Run tests
        run: |
          pytest .

      - name: Run docstring examples
        run: |
          pytest --doctest-modules src/cunumpy

  # PyPI rejects direct references (`name @ git+...`): the wheel's metadata must have none.
  no-direct-references:
    if: (github.base_ref || github.ref_name) == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the wheel for direct references
        run: |
          python -m pip install build
          python -m build --wheel
          ! unzip -p dist/*.whl '*.dist-info/METADATA' | grep -E '^Requires-Dist:.* @ '
