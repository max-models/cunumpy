variables:
  # Base image with CUDA and C++ tools
  CUDA_IMAGE: "nvidia/cuda:12.4.1-devel-ubuntu22.04"
  # Instruct pip to install to a directory in the path, or avoid the 'UNKNOWN' warning
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

stages:
  - test

gpu_tests:
  stage: test
  image: ${CUDA_IMAGE}
  tags:
    - gpu-nvidia
    - gpu-nvidia-cc80
  before_script:
    # Set non-interactive timezone to prevent tzdata prompting
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update && apt-get install -y cmake python3-pip git
  script:
    - echo "--- CUDA Sanity Check ---"
    - nvidia-smi
    
    - echo "--- Detect Compute Capability ---"
    - nvidia-smi --query-gpu=compute_cap --format=csv,noheader
    
    - echo "--- CMake Build ---"
    - if [ -f "CMakeLists.txt" ]; then
        mkdir build && cd build;
        cmake ..;
        make -j$(nproc);
        cd ..;
      fi
    
    - echo "--- Pytest Execution ---"
    # Ensure pip is up to date and install test requirements directly
    - python3 -m pip install --upgrade pip
    - pip3 install pytest cupy-cuda12x
    # Install the package itself
    - pip3 install -e .
    # Set the backend to cupy for tests and run them
    - export ARRAY_BACKEND=cupy
    - python3 -m pytest tests/unit/
