variables:
  # Base image with CUDA and C++ tools
  CUDA_IMAGE: "nvidia/cuda:12.4.1-devel-ubuntu22.04"

stages:
  - test

# GPU Test Step: Run CUDA sanity checks, build, and test
# Since GitHub now pushes the code directly to GitLab, we can just use the local repo.
gpu_tests:
  stage: test
  image: ${CUDA_IMAGE}
  tags:
    - gpu-nvidia
    - gpu-nvidia-cc80
  before_script:
    - apt-get update && apt-get install -y cmake python3-pip git
  script:
    - echo "--- CUDA Sanity Check ---"
    - nvidia-smi
    
    - echo "--- Detect Compute Capability ---"
    - nvidia-smi --query-gpu=compute_cap --format=csv,noheader
    
    - echo "--- CMake Build ---"
    - if [ -f "CMakeLists.txt" ]; then
        mkdir build && cd build;
        cmake ..;
        make -j$(nproc);
        cd ..;
      fi
    
    - echo "--- Pytest Execution ---"
    - pip3 install .[test]
    - pytest tests/unit/
