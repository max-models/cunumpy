variables:
  CUDA_IMAGE: "gitlab-registry.mpcdf.mpg.de/mpcdf/ci-module-image/nvhpcsdk_26:2026"
  ROCM_IMAGE: "gitlab-registry.mpcdf.mpg.de/mpcdf/ci-module-image/gcc_15-openmpi_5_0-rocm_7_1:2026"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CUNUMPY_BACKEND: "cupy"
  CUNUMPY_REQUIRE_CUDA: "1"
  # empty: the newest CuPy; gpu_tests_min_cupy pins the oldest supported one
  CUPY_PIN: ""
  # MI210 (MPCDF-GPU-05) is CDNA2, offload architecture gfx90a; also covers
  # MI200/MI250(X). Change this (and the gpu-amd-gfx* tag below) for another
  # AMD GPU generation.
  HCC_AMDGPU_TARGET: "gfx90a"

stages:
  - test

.gpu_job_nvidia:
  stage: test
  image: ${CUDA_IMAGE}
  tags:
    - gpu-nvidia
    - gpu-nvidia-cc80
  before_script:
    - module load python-waterboa/2025.06
    - module load nvhpcsdk/26
    - module load fftw-serial/3.3.10
    - nvidia-smi
    # Keep NVRTC, CUDA libraries and headers on the same toolkit generation.
    - python3 -m pip install --user "cupy-cuda13x[ctk]${CUPY_PIN}" "cuda-toolkit==13.2.*"
    - python3 -m pip install --user -e ".[test]"
    - export PATH="$HOME/.local/bin:$PATH"
    - python3 -c "import cupy; cupy.show_config()"

# CuPy has no prebuilt ROCm wheel for recent ROCm (the old cupy-rocm-*
# packages stop at ROCm 4.3), so this builds it from source against the
# module-provided ROCm. HCC_AMDGPU_TARGET above must match the runner's GPU.
.gpu_job_amd:
  stage: test
  image: ${ROCM_IMAGE}
  tags:
    - gpu-amd
    - gpu-amd-gfx90a
  before_script:
    - module load gcc/15
    - module load openmpi/5.0
    - module load rocm/7.1
    - module load python-waterboa/2025.06
    - rocm-smi
    - export ROCM_HOME="${ROCM_PATH:-/opt/rocm}"
    - export CUPY_INSTALL_USE_HIP=1
    - python3 -m pip install --user "cupy${CUPY_PIN}"
    - python3 -m pip install --user -e ".[test]"
    - export PATH="$HOME/.local/bin:$PATH"
    - python3 -c "import cupy; cupy.show_config()"
    - python3 -c "import cupy; assert cupy.cuda.runtime.is_hip, 'expected a HIP build of CuPy'"

gpu_tests_nvidia:
  extends: .gpu_job_nvidia
  script:
    - python3 -m pytest -q tests
    - python3 testing/cupyx_names.py

# cunumpy/reduce.cuh and cunumpy/scan.cuh are not yet ported to HIP: tests that
# need them use `requires_warp_shuffle`, which skips (not fails) here even
# though CUNUMPY_REQUIRE_CUDA is set, see cunumpy.kernel_testing.
gpu_tests_amd:
  extends: .gpu_job_amd
  script:
    - python3 -m pytest -q tests
    - python3 testing/cupyx_names.py

# The oldest supported CuPy (cunumpy.MIN_CUPY_VERSION): the whole suite, and the
# fake cupyx.scipy must list exactly its names (_fake_cupyx.NAMES).
gpu_tests_min_cupy_nvidia:
  extends: .gpu_job_nvidia
  variables:
    CUPY_PIN: "==14.0.0"
  script:
    - python3 -c "import cupy, cunumpy; assert cupy.__version__ == cunumpy.MIN_CUPY_VERSION, cupy.__version__"
    - python3 -m pytest -q tests
    - python3 testing/cupyx_names.py --exact

gpu_sanitizers_nvidia:
  extends: .gpu_job_nvidia
  timeout: 45 minutes
  parallel:
    matrix:
      - SANITIZER: [memcheck, racecheck, synccheck]
  script:
    - compute-sanitizer --version
    # These tests intentionally contain no illegal-access demonstration kernels.
    - >-
      compute-sanitizer --tool "$SANITIZER" --error-exitcode 1
      --target-processes all python3 -m pytest -q
      tests/unit/test_cuda_collectives.py
      tests/unit/test_automatic_launch.py
      tests/unit/test_cuda_launch_limits.py
      tests/unit/test_reusable_streams.py
      tests/unit/test_staging.py
      tests/unit/test_mirror.py
      tests/unit/test_mpi_staging.py
      tests/unit/test_segment_plans.py
