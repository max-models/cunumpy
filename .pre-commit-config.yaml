repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0  # Use the latest stable version
    hooks:
      - id: check-added-large-files # Prevent giant files from being committed.
        args: ["--maxkb=1000"]     
      - id: check-merge-conflict    # Check for files that contain merge conflict strings.
      - id: check-toml              # Attempts to load all TOML files to verify syntax.
      - id: check-yaml              # Attempts to load all yaml files to verify syntax.
        args: ["--unsafe"]

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout # remove jupyter notebook cell output

  - repo: https://github.com/bwhmather/ssort
    rev: v0.12.0
    hooks:
      - id: ssort # sort statements so definitions come before their use

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check # lint, including import sorting
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/numpy/numpydoc
    rev: v1.11.0
    hooks:
      - id: numpydoc-validation # docstring sections, configured in pyproject.toml
        files: ^src/cunumpy/
        exclude: _fake_cupy
