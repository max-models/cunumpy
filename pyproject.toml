[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "cunumpy"
version = "0.6.0"
description = "Simple wrapper for numpy and cupy. Replace `import numpy as np` with `import cunumpy as xp`."
readme = "README.md"
keywords = [ "python" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "array-api-compat",
  "maybempi>=0.1.2",
  "numpy",
]

optional-dependencies.dev = [
  "ruff",
  "cunumpy[test-compiled,docs]",
]
# https://medium.com/@pratikdomadiya123/build-project-documentation-quickly-with-the-sphinx-python-2a9732b66594
optional-dependencies.docs = [
  "ipykernel",
  "myst-parser",
  "nbconvert",
  "nbsphinx",
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "sphinx",
  "sphinx-book-theme",
]
optional-dependencies.test = [ "coverage", "pytest", "scipy" ]
optional-dependencies.test-compiled = [ "cunumpy[test]", "pyccel" ]
urls."Source" = "https://github.com/max-models/cunumpy"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
cunumpy = [ "py.typed", "*.pyi", "LLM_GUIDE.md", "cuda/include/cunumpy/*.cuh" ]

[tool.ruff]
# agent worktrees and scratch scripts are local copies, not part of the project
extend-exclude = [ ".claude" ]
# formatting: `ruff format`; import sorting: the isort rules of `ruff check`
lint.extend-select = [ "I", "TID252" ]
lint.isort.known-first-party = [ "cunumpy" ]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
