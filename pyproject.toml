[build-system]
build-backend = "setuptools.build_meta"

requires = [ "setuptools", "wheel" ]

[project]
name = "cunumpy"
version = "0.6.3"
description = "Simple wrapper for numpy and cupy. Replace `import numpy as np` with `import cunumpy as xp`."
readme = "README.md"
keywords = [ "python" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "array-api-compat",
  "maybempi>=0.1.2",
  "numpy",
]

optional-dependencies.dev = [
  "ruff",
  "cunumpy[test-compiled,docs]",
]
# https://medium.com/@pratikdomadiya123/build-project-documentation-quickly-with-the-sphinx-python-2a9732b66594
optional-dependencies.docs = [
  "ipykernel",
  "myst-parser",
  "nbconvert",
  "nbsphinx",
  "numpydoc",
  "jupyterlab",
  "pre-commit",
  "pyproject-fmt",
  "sphinx",
  "sphinx-book-theme",
]
optional-dependencies.metal = [ "mlx; sys_platform == 'darwin' and platform_machine == 'arm64'" ]
optional-dependencies.test = [ "coverage", "pytest", "scipy" ]
optional-dependencies.test-compiled = [ "cunumpy[test]", "pyccel" ]
urls."Source" = "https://github.com/max-models/cunumpy"

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools.package-data]
cunumpy = [ "py.typed", "*.pyi", "LLM_GUIDE.md", "cuda/include/cunumpy/*.cuh" ]

[tool.ruff]
# agent worktrees and scratch scripts are local copies, not part of the project
extend-exclude = [ ".claude" ]
# formatting: `ruff format`; import sorting: the isort rules of `ruff check`
lint.extend-select = [ "D", "I", "TID252" ]
# D105/D107: magic methods and __init__ (constructor parameters go in the class docstring)
lint.extend-ignore = [ "D105", "D107" ]
lint.isort.known-first-party = [ "cunumpy" ]
lint.per-file-ignores."_fake_cupy*.py" = [ "D" ]
lint.per-file-ignores."conftest.py" = [ "D" ]
lint.per-file-ignores."docs/**" = [ "D" ]
lint.per-file-ignores."tests/**" = [ "D" ]
lint.pydocstyle.convention = "numpy"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# `python -m numpydoc lint src/cunumpy/*.py`: the public API (names re-exported by a public
# module) has full numpydoc sections; private helpers only need a one-line summary.
[tool.numpydoc_validation]
checks = [
  "all",
  "ES01", # extended summary is optional (docstrings are kept short)
  "EX01", # examples are required for public functions and classes, not every method
  "SA01", # See Also is optional
  "GL08", # undocumented objects are caught by ruff's D rules instead
]
# one-line docstrings (properties, trivial methods) need no Returns section
override_RT01 = [ '\A[^\n]*\Z' ]
exclude = [
  '\._[A-Za-z]\w*$',  # private functions, classes and methods
  '\.__\w+__$',    # dunder methods
  '_fake_cupy',
]
